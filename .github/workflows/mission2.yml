name: Mission 2 validation
on:
  pull_request:
    paths:
      - 'hypergen/**'
      - 'tests/**'
      - 'web/**'
      - 'requirements.txt'
      - 'models.yaml'
      - '.github/workflows/mission2.yml'
  push:
    branches:
      - feature/mission2-benchmark
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
